<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浅拷贝-手写代码</title>
</head>
<body>
    <script>
        // 浅拷贝概念：
        //     浅拷贝指的是拷贝一个对象，或者说创建一个新对象。
        //     如果属性值是基本类型，则拷贝的是基本类型的值。
        //     如果属性值是引用类型，则拷贝的引用类型的内存地址。
        //     所以，如果原对象中的引用类型的值发生改变，则新拷贝的对象中引用类型的值也会发生改变。
        
        // 浅拷贝的实现方式有很多种，比如：
        //     1、扩展运算符
        //     2、对象的方法 Object.assign()
        //     3、数组的方法 Array.concat()
        //     4、数组的方法 Array.slice()

        // 手动实现浅拷贝
        // 步骤：
            // 1、判断是否是基本类型还是引用类型，如果是基本类型则直接return出去，如果是引用类型则继续。
            // 2、遍历对象或者数组，在这之前需要创建一个新对象
            // 3、判断是对象还是数组，然后遍历对象或者数组，将属性值赋值给新对象
            // 4、返回新对象

        function showllowCopy(obj) {
            // 1、判断是否是基本类型还是引用类型，基本类型直接return出去
            if ( obj === null || typeof obj !== 'object') {
                return obj;
            }
            // 2、创建一个新对象或者新数组，根据入参是对象还是数组来创建
            let newObj = Array.isArray(obj) ? [] : {};
            // 3、遍历对象或者数组，将入参的属性赋值到新对象或者数组中。
            for (key in obj) {
                // 3.1、判断是否是对象的属性，而不是原型链上的属性
                // 重要说明：数组也是对象！数组也有原型链！
                // 数组继承自Array.prototype，Array.prototype又继承自Object.prototype
                // 所以数组也需要使用hasOwnProperty来过滤原型链上的属性
                if (obj.hasOwnProperty(key)) {
                    newObj[key] = obj[key];
                }
            }
            // 4、返回新对象或者新数组
            return newObj;
        }

        // 测试
        let obj = {
            name: '张三',
            age: 18,
            sex: '男',
            hobby: ['篮球', '足球', '跑步'],
            family: {
                father: '张三的爸爸',
                mother: '张三的妈妈'
            }
        }
        let newObj = showllowCopy(obj);
        console.log(newObj);
    </script>
</body>
</html>
